# liveness-subsystems.conf — every scheduled/background subsystem that must prove it ran.
#
# `heimdall-liveness check` iterates THIS FILE, never the receipt directory. A directory
# scan of a subsystem that has never run once lists nothing and calls it health — which
# is exactly how the nightly dream stayed silent for 26 days. A row here with no receipt
# reads NON_VERIFIED, loudly.
#
# Format:  name|period_s|miss_threshold|scope|subject_label|remedy
#
#   period_s        the cycle it is supposed to keep
#   miss_threshold  N — how many consecutive cycles may pass with no REACHED run before
#                   the receipt goes loud. Chosen per subsystem from its own period and
#                   its own failure cost; the justification is on each row.
#   scope           local    — every machine running heimdall
#                   operator — only a box that runs the hosted control-plane jobs
#                              (marked by HEIMDALL_LIVENESS_OPERATOR=1 or
#                              $HEIMDALL_HOME/operator). Elsewhere it reports
#                              NOT_APPLICABLE — listed, never silently dropped.
#   subject_label   what it must REACH for its output to mean anything. Completion is
#                   not reachability; this names the thing a completed run has to have
#                   touched.
#   remedy          what a human runs when it goes loud.

# Nightly at 03:00 via launchd (com.heimdall.dream). N=2: launchd catches up on wake, so
# ONE missed night is a closed laptop; TWO is an outage. Matches the --min-gap default in
# heimdall-dream-notice, already tuned against this exact failure.
dream|86400|2|local|the git repo it analyses|heimdall-dream-permission ask --force

# SessionStart, self-throttled to 24h. N=7: it can only fire when a session starts, so
# N=1 would alarm on any day without one. A week with no successful reach of the release
# API is a broken update path — the receipt states the fact, not the cause.
autoupdate|86400|7|local|the GitHub releases API|heimdall-autoupdate check --force

# PostToolUse(Write|Edit), throttled 900s. Its cadence tracks activity, not the clock, and
# today it discards exit 3 (push failed) entirely. N=7: a week of edits with zero
# successful hmd/context pushes is the failure it currently cannot report.
context-sync|86400|7|local|the origin git remote|heimdall-context-sync sync

# Claims "runs unattended every Monday" and NOTHING schedules it. N=2: two missed Mondays
# is a fortnight with no draft — past the point a human notices unaided.
weekly-log|604800|2|local|the git history of the last 7 days|heimdall-weekly-log

# Daily cost brake. Its output IS the 50/75/90 tier alerts, so N=3 silent days is a full
# budget tier of blindness while spend continues.
cost-report|86400|3|operator|the BigQuery billing export|heimdall-cost-report

# Weekly re-validation of the rate constants the daily job projects from. N=2: two missed
# weeks leaves the model unvalidated for a fortnight while it still drives projections.
cost-model-refresh|604800|2|operator|the GCP rate constants|heimdall-cost-model-refresh

# Monthly TTL eviction. N=2: two missed months is 60 days of un-evicted stale keys — the
# same order as its own --max-idle-days default of 60.
registry-hygiene|2592000|2|operator|the haid to pubkey registry|heimdall-registry-hygiene --apply
