# public-repo-no-secrets — a credential must never land in the public repo.
#
# This is the CI counterpart to the local gates: bin/secret-scan (R8, staged
# diff at commit time) and bin/heimdall-selfscan (R10, full history at push
# time). Those run on a maintainer's machine and can be bypassed — agents commit
# with --no-verify, and a push from an unconfigured clone never sees them. This
# workflow is the backstop that cannot be bypassed: it runs on GitHub, on every
# push and every pull request, against the history GitHub actually holds.
#
# Why full history and not just the working tree: in CI every byte under review
# is already committed, so scanning the commit graph strictly dominates a
# working-tree scan — it catches a credential that was added and then deleted in
# a later commit, which a tree scan cannot see.
#
# The scanner is pinned twice over: the release tag AND the sha256 of the
# tarball. An unpinned download would let a compromised release silently become
# the thing that certifies this repo clean.
name: public-repo-no-secrets

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-repo-no-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate scans the whole commit graph; the default
      # shallow checkout would hide every commit but the tip.
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Version-pinned AND sha256-pinned. GITLEAKS_SHA256 is the value published
      # in gitleaks_8.30.1_checksums.txt on the upstream release; sha256sum -c
      # fails the step if the downloaded bytes differ.
      - name: Install gitleaks (tag + sha256 pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --config is passed explicitly so CI scans IDENTICALLY to the local gates
      # (.gitleaks.toml keeps the full built-in ruleset via useDefault = true and
      # only allowlists named fixture-bearing paths).
      # --redact keeps a found credential out of the public build log.
      # --exit-code 1 makes any finding a hard build failure.
      - name: Scan full history for secrets
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts=--all \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      # Uploaded only when the scan FAILED, and only ever redacted, so a
      # maintainer can see file/rule/line without the credential itself.
      - name: Upload redacted findings report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-findings-redacted
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
