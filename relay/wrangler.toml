name = "hmd-relay"
main = "src/worker.ts"
compatibility_date = "2026-08-22"

# RELAY_SIGNING_SECRET is deliberately NOT declared here as a [vars] plaintext
# value — it is a Workers secret in every real environment:
#   local dev:  relay/.dev.vars (gitignored) -> RELAY_SIGNING_SECRET=<value>
#   deployed:   `wrangler secret put RELAY_SIGNING_SECRET`
#   vitest:     injected via vitest.config.ts's miniflare bindings (test-only)
# See README.md.
#
# Pair-by-session-code (README.md, "Pair by session code") needs three more values, and a Worker
# missing ANY of them answers 503 `code pairing disabled` on its four code-pairing routes while
# the QR flow carries on untouched:
#   GITHUB_CLIENT_ID       [vars] below: the PUBLIC client id of the project's GitHub App. A public
#                          identifier (it is in the app and in the device-flow URL), committed on
#                          purpose; not a secret.
#   GITHUB_CLIENT_SECRET   `npx wrangler secret put GITHUB_CLIENT_SECRET` (and `--env canary`): the
#                          App's client secret, the Basic-auth half of the check-token call.
#   RELAY_IDENTITY_SECRET  `npx wrangler secret put RELAY_IDENTITY_SECRET` (and `--env canary`):
#                          the HMAC key of the gh_assertion; any high-entropy random string,
#                          distinct from RELAY_SIGNING_SECRET.
# local dev: relay/.dev.vars (gitignored) carries the two secrets. vitest: injected via
# vitest.config.ts's miniflare bindings (test-only placeholders, and a fake GitHub).
#
# GitHub sign-in through the browser (README.md, "GitHub sign-in through the browser") adds four
# routes under /identity/github/oauth. They exist only when the three values above are all set AND
# this switch is exactly the string "1"; any other value, "0" included, leaves them answering the
# Worker's 404 as if they were never there:
#   GITHUB_OAUTH_WEB       [vars] below, and again in [env.canary.vars]: each Worker has its own
#                          switch. Shipped "0" on purpose. Flip a Worker to "1" only after the
#                          GitHub App's Callback URL for THAT Worker is registered
#                          (<origin>/identity/github/oauth/callback), or the app would offer a
#                          browser sign-in that fails at GitHub. No new secret is needed.

[vars]
GITHUB_CLIENT_ID = "Iv23liawqpKieqqpgIPj"
GITHUB_OAUTH_WEB = "0"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

# The canary Worker that .github/workflows/relay-deploy.yml ships to and probes before promoting the
# same commit to production. A SEPARATE Worker rather than a gradual rollout of this one: its own
# Durable Object namespace, so a bad build cannot touch a live session, and its own signing secret
# (`npx wrangler secret put RELAY_SIGNING_SECRET --env canary`). `wrangler deploy --env canary`.
#
# Wrangler does not inherit `durable_objects` into an environment, so the binding is restated here;
# leave it out and the canary deploys with no Durable Object at all while /health still passes.
# `migrations` IS inherited, which is what keeps the canary on exactly production's migration
# history, so it is deliberately not restated. test/relay-deploy-workflow.test.sh fails on drift.
[env.canary]
name = "hmd-relay-canary"

[[env.canary.durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

# `vars` is not inherited into an environment either, so the canary restates the public client id:
# the same GitHub App as production. Its two secrets are its own (`wrangler secret put ... --env canary`).
# It restates GITHUB_OAUTH_WEB too, for the same reason; the two Workers' switches are independent.
[env.canary.vars]
GITHUB_CLIENT_ID = "Iv23liawqpKieqqpgIPj"
GITHUB_OAUTH_WEB = "0"
