name = "hmd-relay"
main = "src/worker.ts"
compatibility_date = "2026-08-22"

# RELAY_SIGNING_SECRET is deliberately NOT declared here as a [vars] plaintext
# value — it is a Workers secret in every real environment:
#   local dev:  relay/.dev.vars (gitignored) -> RELAY_SIGNING_SECRET=<value>
#   deployed:   `wrangler secret put RELAY_SIGNING_SECRET`
#   vitest:     injected via vitest.config.ts's miniflare bindings (test-only)
# See README.md.

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

# The canary Worker that .github/workflows/relay-deploy.yml ships to and probes before promoting the
# same commit to production. A SEPARATE Worker rather than a gradual rollout of this one: its own
# Durable Object namespace, so a bad build cannot touch a live session, and its own signing secret
# (`npx wrangler secret put RELAY_SIGNING_SECRET --env canary`). `wrangler deploy --env canary`.
#
# Wrangler does not inherit `durable_objects` into an environment, so the binding is restated here;
# leave it out and the canary deploys with no Durable Object at all while /health still passes.
# `migrations` IS inherited, which is what keeps the canary on exactly production's migration
# history, so it is deliberately not restated. test/relay-deploy-workflow.test.sh fails on drift.
[env.canary]
name = "hmd-relay-canary"

[[env.canary.durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"
